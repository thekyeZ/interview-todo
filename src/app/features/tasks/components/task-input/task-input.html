<section class="mb-space-xl">
  <form
    (submit)="onSubmit($event)"
    class="relative flex flex-col gap-space-sm bg-surface-container-lowest p-space-sm rounded-lg shadow-sm border border-surface-container-low"
  >
    <div class="flex items-center gap-space-sm">
      <input
        type="text"
        autocomplete="off"
        aria-label="New task title"
        placeholder="What needs to be done?"
        [formField]="taskForm.title"
        class="w-full bg-transparent text-headline-md text-on-surface placeholder:text-outline-variant px-space-md py-space-sm outline-none"
      />
      <button
        type="submit"
        [disabled]="isCreating()"
        class="shrink-0 bg-primary text-on-primary text-label-md px-space-lg py-space-sm rounded transition-colors hover:bg-neutral-800 active:scale-95 flex items-center gap-space-xs disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span>Add</span>
        <span class="text-[10px] opacity-60 hidden sm:inline tracking-tighter">↵</span>
      </button>
    </div>
  </form>
</section>
